<header class="u-header">
  <div class="u-top">
    <a href="{{ '/' | relative_url }}" class="u-brand">
      <img class="u-logo" src="{{ '/images/logo.jpg' | relative_url }}" width="60" height="31" alt="Urban Morphology Studio logo">
      <span>URBAN MORPHOLOGY<br>STUDIO</span>
    </a>
    <div class="u-themes" role="group" aria-label="Color theme">
      <button type="button" data-theme-choice="light" aria-pressed="false">Bright</button>
      <button type="button" data-theme-choice="dark" aria-pressed="true">Dark</button>
    </div>
  </div>
  <nav class="u-nav" aria-label="Main navigation">
    <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/research/' | relative_url }}" {% if page.url contains '/research/' %}aria-current="page"{% endif %}>Research</a>
    <a href="{{ '/team/' | relative_url }}" {% if page.url contains '/team/' or page.collection == 'members' %}aria-current="page"{% endif %}>Team</a>
    <a href="{{ '/news/' | relative_url }}" {% if page.url contains '/news/' or page.collection == 'posts' %}aria-current="page"{% endif %}>News</a>
    <a href="{{ '/about/' | relative_url }}" {% if page.url contains '/about/' %}aria-current="page"{% endif %}>About</a>
    <a href="{{ '/contact/' | relative_url }}" {% if page.url contains '/contact/' %}aria-current="page"{% endif %}>Contact</a>
  </nav>
</header>
